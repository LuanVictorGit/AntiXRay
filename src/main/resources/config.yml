enabled: true

worlds:
  - world
  - world_nether
  - survival
  - survival_nether
  - survival_spawn

# Blocos escondidos de quem usa x-ray (textura ou hack).
# "bloco" aparece como pedra/deepslate/netherrack/end stone (veja replacements).
# "bloco=substituto" aparece como o substituto (ex.: air = some ate o jogador chegar perto).
hidden-blocks:
  # Minerios
  - DIAMOND_ORE
  - DEEPSLATE_DIAMOND_ORE
  - GOLD_ORE
  - DEEPSLATE_GOLD_ORE
  - NETHER_GOLD_ORE
  - IRON_ORE
  - DEEPSLATE_IRON_ORE
  - COAL_ORE
  - DEEPSLATE_COAL_ORE
  - REDSTONE_ORE
  - DEEPSLATE_REDSTONE_ORE
  - LAPIS_ORE
  - DEEPSLATE_LAPIS_ORE
  - EMERALD_ORE
  - DEEPSLATE_EMERALD_ORE
  - COPPER_ORE
  - DEEPSLATE_COPPER_ORE
  - NETHER_QUARTZ_ORE
  - ANCIENT_DEBRIS
  # Blocos de minerio (brutos dos veios e de armazenamento)
  - RAW_IRON_BLOCK
  - RAW_COPPER_BLOCK
  - RAW_GOLD_BLOCK
  - IRON_BLOCK
  - GOLD_BLOCK
  - DIAMOND_BLOCK
  - EMERALD_BLOCK
  - LAPIS_BLOCK
  - REDSTONE_BLOCK
  - NETHERITE_BLOCK
  # Blocos infestados (silverfish): aparecem como o bloco normal, iguais visualmente
  - INFESTED_STONE=STONE
  - INFESTED_COBBLESTONE=COBBLESTONE
  - INFESTED_STONE_BRICKS=STONE_BRICKS
  - INFESTED_MOSSY_STONE_BRICKS=MOSSY_STONE_BRICKS
  - INFESTED_CRACKED_STONE_BRICKS=CRACKED_STONE_BRICKS
  - INFESTED_CHISELED_STONE_BRICKS=CHISELED_STONE_BRICKS
  - INFESTED_DEEPSLATE=DEEPSLATE
  # Dungeons e geradores de mobs
  - SPAWNER=AIR
  - TRIAL_SPAWNER=AIR
  - VAULT=AIR
  - MOSSY_COBBLESTONE
  # Baus
  - CHEST=AIR
  - TRAPPED_CHEST=AIR
  # Minas abandonadas: trilhos e teias
  - RAIL=AIR
  - POWERED_RAIL=AIR
  - DETECTOR_RAIL=AIR
  - ACTIVATOR_RAIL=AIR
  - COBWEB=AIR

replacements:
  normal: STONE
  deepslate: DEEPSLATE
  nether: NETHERRACK
  end: END_STONE

reveal-distance: 2
# Minerios expostos (em cavernas, agua, lava) ficam escondidos e so aparecem
# quando o jogador chega a esta distancia em blocos. Bloqueia x-ray por textura
# e por hack. 0 = desativa (minerios expostos sempre visiveis). Maximo: 64
proximity-distance: 16
# Blocos expostos so sao escondidos abaixo desta altura no overworld: trilhos, baus e
# minerios da superficie continuam visiveis de longe. Nether e End nao tem limite.
proximity-max-height: 64
max-cache-size: 4096
check-bypass: false
debug: false
log-level: INFO

messages:
  prefix: "&8[&bAntiXray&8] &7"
  reloaded: "&aConfiguracao recarregada com sucesso."
  no-permission: "&cVoce nao tem permissao para executar este comando."
  status:
    header: "&b=== &fStatus do AntiXray &b==="
    enabled: "&7Status: &aAtivado"
    disabled: "&7Status: &cDesativado"
    version: "&7Protocolo do Servidor: &f%version%"
    worlds: "&7Mundos Protegidos: &f%worlds%"
    stats: "&7Chunks Processados: &f%chunks_proc% &7(Modificados: &a%chunks_mod%&7) | Minerios Ocultados: &e%ores_hidden%"
    cached-players: "&7Jogadores em Cache: &f%players%"
    cached-chunks: "&7Bordas de Chunks em Cache: &f%chunks%"
    debug-mode: "&7Modo Debug: &f%debug%"
  debug-toggle: "&7Modo debug &f%state%&7."
