# Worlds where AntiXray is active (world name or key, "*" for all worlds).
worlds:
  - world
  - world_nether
  - world_the_end

# Blocks hidden from players until they can actually see them.
# Use BLOCK=REPLACEMENT to choose what is shown instead (default: stone, deepslate, netherrack or end stone).
hidden-blocks:
  - COAL_ORE
  - DEEPSLATE_COAL_ORE
  - IRON_ORE
  - DEEPSLATE_IRON_ORE
  - COPPER_ORE
  - DEEPSLATE_COPPER_ORE
  - GOLD_ORE
  - DEEPSLATE_GOLD_ORE
  - REDSTONE_ORE
  - DEEPSLATE_REDSTONE_ORE
  - LAPIS_ORE
  - DEEPSLATE_LAPIS_ORE
  - DIAMOND_ORE
  - DEEPSLATE_DIAMOND_ORE
  - EMERALD_ORE
  - DEEPSLATE_EMERALD_ORE
  - NETHER_GOLD_ORE
  - NETHER_QUARTZ_ORE
  - ANCIENT_DEBRIS
  - RAW_IRON_BLOCK
  - RAW_COPPER_BLOCK
  - RAW_GOLD_BLOCK
  - IRON_BLOCK
  - GOLD_BLOCK
  - DIAMOND_BLOCK
  - EMERALD_BLOCK
  - LAPIS_BLOCK
  - REDSTONE_BLOCK
  - NETHERITE_BLOCK
  - INFESTED_STONE=STONE
  - INFESTED_COBBLESTONE=COBBLESTONE
  - INFESTED_STONE_BRICKS=STONE_BRICKS
  - INFESTED_MOSSY_STONE_BRICKS=MOSSY_STONE_BRICKS
  - INFESTED_CRACKED_STONE_BRICKS=CRACKED_STONE_BRICKS
  - INFESTED_CHISELED_STONE_BRICKS=CHISELED_STONE_BRICKS
  - INFESTED_DEEPSLATE=DEEPSLATE
  - MOSSY_COBBLESTONE
  - SPAWNER=AIR
  - TRIAL_SPAWNER=AIR
  - VAULT=AIR
  - CHEST=AIR
  - TRAPPED_CHEST=AIR
  - RAIL=AIR
  - POWERED_RAIL=AIR
  - DETECTOR_RAIL=AIR
  - ACTIVATOR_RAIL=AIR
  - COBWEB=AIR

# Maximum distance (in blocks, up to 64) at which exposed hidden blocks are shown while in line of sight.
proximity-distance: 16
